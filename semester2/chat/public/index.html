<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чат поддержки — Лунная линия</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><main><header><h1>☾ Лунная линия</h1><p>Учебный общий чат поддержки. Сообщения видны всем участникам.</p><p id="status" role="status">Не подключён</p><p id="users"></p></header><form id="join"><label for="name">Ваше имя</label><input id="name" required maxlength="40" autocomplete="nickname"><button>Войти</button></form><div id="messages" role="log" aria-live="polite" aria-label="Сообщения"></div><p id="typing" role="status"></p><form id="compose"><label for="message">Сообщение</label><input id="message" required maxlength="2000" disabled><button disabled>Отправить</button></form><button id="reconnect" hidden>Подключиться снова</button></main></body></html>
